name: Sanitize public email history

on:
  push:
    branches: [main]
    paths: [".github/workflows/sanitize-email-history.yml"]

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rewrite public history
        shell: bash
        run: |
          python -m pip install --quiet git-filter-repo
          printf '%s%s==>adithyah07[at]gmail[dot]com\n' 'adithyah07@' 'gmail.com' > replacements.txt
          printf '%s%s==>ahegde83[at]gatech[dot]edu\n' 'ahegde83@' 'gatech.edu' >> replacements.txt
          git filter-repo --force --replace-text replacements.txt --email-callback 'return b"noreply@users.noreply.github.com"'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "Adithya Hegde"
          git config user.email "noreply@users.noreply.github.com"
          git rm .github/workflows/sanitize-email-history.yml
          git commit -m "Remove temporary history sanitization workflow"
          git push --force origin HEAD:main
