name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See docs/CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run citation update script
        run: timeout 90 python bin/update_scholar_citations.py

      - name: Commit and push citation changes
        run: |
          citations_file=_data/citations.yml
          if [ -f "$citations_file" ]; then
            git add -- "$citations_file"
            if ! git diff --staged --quiet -- "$citations_file"; then
              git config --local user.email "actions@github.com"
              git config --local user.name "GitHub Actions"
              git commit -m "Update Google Scholar citations"
              git push
              echo "Updated Google Scholar citations." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "No citation changes to commit." >> "$GITHUB_STEP_SUMMARY"
