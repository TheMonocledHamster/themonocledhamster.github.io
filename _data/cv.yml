cv:
  name: Adithya Hegde
  headline: MSCS @ Georgia Institute of Technology
  location: Atlanta, GA
  email: ahegde83[at]gatech[dot]edu
  summary: MSCS Computing Systems and MS Research Fellow at Georgia Tech. Owned the technical design and implementation of a new Spark-based data platform at JPMorgan Chase. Building the platform required understanding the systems beneath the application, motivating a move toward systems engineering. Research interests include resource management, distributed systems, and systems for machine learning.
  social_networks:
    - network: LinkedIn
      username: adithya-hegde
    - network: GitHub
      username: TheMonocledHamster
  sections:
    Research Interests:
      - bullet: Data Systems, Resource Management, Systems for ML, Distributed Systems, and Cloud Infrastructure
    Publications:
      - title: COUNSEL - Cloud Resource Configuration Management using Deep Reinforcement Learning
        authors:
          - "**Adithya Hegde**"
          - Sameer G. Kulkarni
          - Abhinandan S. Prasad
        doi: 10.1109/ccgrid57682.2023.00035
        date: 2023-05
        publisher: "IEEE/ACM CCGRID 2023"
        summary: Co-developed a DRL-based framework for cloud resource configuration and evaluated it using simulated multi-component workloads. Artifacts available on GitHub [(Counsel)](https://github.com/TheMonocledHamster/Counsel).
    Experience:
      - company: JPMorgan Chase & Co.
        position: Software Engineer II
        start_date: 2025-01
        end_date: 2026-07
        highlights:
          - Owned the end-to-end technical design and implementation of a new Spark-based data platform replacing legacy processing systems, from architecture through production rollout.
          - Redesigned platform execution to eliminate Databricks-DynamoDB state synchronization, removing a fragile distributed dependency and improving throughput by up to 80%.
          - Reduced runtime of a complex ~60-operation Spark DAG processing 1-10M records from ~10 minutes to ~1.5 minutes through logical-plan optimization and data-dependent DAG construction.
          - Redesigned partitioning and tuned parallelism to mitigate shuffle bottlenecks, reducing cluster compute costs by ~40% without performance degradation.
          - Optimized table partitioning using Spark execution plans and Databricks query profiles, increasing data skipping from 65% to 98% and reducing dashboard refresh latency from ~5 minutes to ~10 seconds.
      - company: JPMorgan Chase & Co.
        position: Software Engineer I
        start_date: 2023-07
        end_date: 2024-12
        highlights:
          - Profiled memory growth of a Polars-based transformation in AWS Lambda; introduced lazy evaluation and explicit object lifecycle control, reducing peak memory allocation by 60% and stabilizing execution latency.
          - Brought up a multi-node ingestion system on Kubernetes (EKS + NiFi), implemented Airflow orchestration for distributed workflows, and operated cross-service data movement pipelines in production.
          - Earned accelerated promotion to Software Engineer II for ownership of distributed data infrastructure and production performance engineering.
      - company: JPMorgan Chase & Co.
        position: Software Engineer Intern
        start_date: 2023-01
        end_date: 2023-06
        highlights:
          - Implemented a schema-driven validation tool generating record-level checks from external specifications, eliminating iterative reprocessing and reducing failure diagnosis time by 95%.
    Education:
      - institution: Georgia Institute of Technology
        area: Computer Science - Computing Systems
        degree: MS
        start_date: 2026-08
        end_date: present
        highlights:
          - MS Research Fellow
      - institution: The National Institute of Engineering
        area: Computer Science and Engineering
        degree: BE
        start_date: 2019-08
        end_date: 2023-06
        highlights:
          - Operating Systems, Analysis and Design of Algorithms, Data Structures, Database Systems, Cloud Computing, Discrete Mathematics, Computer Architecture
          - Merit Scholarship (full tuition waiver for all semesters), awarded for top entrance rank.
    Projects:
      - name: "[POWER RTL-to-C Transpiler](https://arxiv.org/abs/2306.08701)"
        date: 2023-06
        highlights:
          - Built a transpiler translating ISA pseudocode into executable simulation models for gem5-based microarchitectural performance experiments.
    Skills:
      - name: Languages
        keywords: [Python, Java, SQL]
      - name: Tools / Platforms
        keywords: [Spark, Databricks, Airflow, Kubernetes, Linux]
      - name: Experience
        keywords: [Data processing, Spark performance tuning, Workflow orchestration, Production debugging]
    Teaching Experience:
      - label: DevOps Workshop
        details: Designed and delivered a five-day hands-on workshop for faculty at Vidhyavardhaka College of Engineering, Mysuru, covering containerization, CI/CD, and deployment workflows for distributed systems.
