cv:
  name: Adithya Hegde
  headline: MSCS Student, Georgia Institute of Technology
  location: Atlanta, GA
  custom_connections:
    - placeholder: ahegde83[at]gatech[dot]edu
      fontawesome_icon: envelope
  summary: Graduate student with industry experience in data systems and distributed data processing. Previously worked on Spark- and Databricks-based production data platforms, including performance tuning, workflow design, and production debugging. Research interests include resource management, distributed systems, and systems for machine learning.
  social_networks:
    - network: LinkedIn
      username: adithya-hegde
    - network: GitHub
      username: TheMonocledHamster
  sections:
    Research Interests:
      - bullet: Data Systems, Resource Management, Systems for ML, Distributed Systems, and Cloud Infrastructure
    Publications:
      - title: COUNSEL - Cloud Resource Configuration Management using Deep Reinforcement Learning
        authors:
          - "**Adithya Hegde**"
          - Sameer G. Kulkarni
          - Abhinandan S. Prasad
        doi: 10.1109/ccgrid57682.2023.00035
        date: 2023-05
        publisher: "IEEE/ACM CCGRID 2023"
        summary: Co-developed a DRL-based framework for cloud resource configuration and evaluated it using simulated multi-component workloads. Artifacts available on GitHub [(Counsel)](https://github.com/TheMonocledHamster/Counsel).
    Experience:
      - company: JPMorgan Chase & Co.
        position: Software Engineer II
        start_date: 2025-01
        end_date: 2026-07
        highlights:
          - Redesigned a Spark workflow that previously relied on external state synchronization between Databricks and DynamoDB, simplifying the workflow and improving throughput by up to 80% for larger workloads.
          - Added an input-aware short-circuit to avoid unnecessary Spark processing for empty inputs, reducing processing time and compute usage.
          - Investigated production performance and correctness issues in PySpark workloads, including issues spanning Python, Spark, and JVM execution.
      - company: JPMorgan Chase & Co.
        position: Software Engineer I
        start_date: 2023-07
        end_date: 2024-12
        highlights:
          - Profiled a Polars transformation running in AWS Lambda and used lazy evaluation and object-lifecycle changes to reduce peak memory usage by approximately 60%.
          - Worked on a multi-node ingestion system using EKS and NiFi, with Airflow orchestration for data workflows.
          - Promoted to Software Engineer II in January 2025.
      - company: JPMorgan Chase & Co.
        position: Software Engineer Intern
        start_date: 2023-01
        end_date: 2023-06
        highlights:
          - Built a schema-driven validation tool that generated record-level checks from external specifications and reduced repeated processing during failure diagnosis.
    Education:
      - institution: Georgia Institute of Technology
        area: Computer Science
        degree: MS
        start_date: 2026-08
        end_date: present
      - institution: The National Institute of Engineering
        area: Computer Science and Engineering
        degree: BE
        start_date: 2019-08
        end_date: 2023-06
        highlights:
          - Operating Systems, Analysis and Design of Algorithms, Data Structures, Database Systems, Cloud Computing, Discrete Mathematics, Computer Architecture
          - Merit Scholarship (full tuition waiver for all semesters), awarded for top entrance rank.
    Projects:
      - name: "[POWER RTL-to-C Transpiler](https://arxiv.org/abs/2306.08701)"
        date: 2023-06
        highlights:
          - Built a transpiler translating ISA pseudocode into executable simulation models for gem5-based microarchitectural performance experiments.
    Skills:
      - name: Languages
        keywords: [Python, Java, SQL]
      - name: Tools / Platforms
        keywords: [Spark, Databricks, Airflow, Kubernetes, Linux]
      - name: Experience
        keywords: [Data processing, Spark performance tuning, Workflow orchestration, Production debugging]
    Teaching Experience:
      - label: DevOps Workshop
        details: Designed and delivered a five-day hands-on workshop for faculty at Vidhyavardhaka College of Engineering, Mysuru, covering containerization, CI/CD, and deployment workflows for distributed systems.
