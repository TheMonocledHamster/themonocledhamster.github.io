cv:
  name: Adithya Hegde
  headline: MSCS @ Georgia Institute of Technology
  location: Atlanta, GA
  social_networks:
    - network: LinkedIn
      username: adithya-hegde
    - network: GitHub
      username: TheMonocledHamster
  sections:
    Research Interests:
      - bullet: Resource management, systems for machine learning, distributed systems, and cloud infrastructure
      - bullet: Data systems with an emphasis on databases, large-scale data processing, and data transfer
    Publications:
      - title: COUNSEL - Cloud Resource Configuration Management using Deep Reinforcement Learning
        authors:
          - "**Adithya Hegde**"
          - Sameer G. Kulkarni
          - Abhinandan S. Prasad
        doi: 10.1109/ccgrid57682.2023.00035
        date: 2023-05
        publisher: "IEEE/ACM CCGRID 2023"
        summary: Co-developed a DRL-based framework for cloud resource configuration and evaluated it using simulated multi-component workloads. Artifacts available on GitHub [(Counsel)](https://github.com/TheMonocledHamster/Counsel).
    Experience:
      - company: Systems for AI Lab, Georgia Institute of Technology
        position: Graduate Research
        start_date: 2026-08
        end_date: present
        highlights:
          - Built gRPC speech recognition workers for MetaServe that support seven decoding configurations across FastConformer CTC, FastConformer RNN-T, and OpenAI Whisper.
      - company: JPMorgan Chase & Co.
        position: Software Engineer II
        start_date: 2025-01
        end_date: 2026-07
        highlights:
          - Owned the design and production rollout of a distributed PySpark and Java platform that replaced a legacy stack that used a proprietary DSL on Hadoop alongside Informatica ETL.
          - Redesigned platform execution to eliminate Databricks-DynamoDB state synchronization, removing a fragile distributed dependency and improving throughput by up to 80%.
          - Built an application-layer generator that automatically produced workload-optimized DAGs for Spark to execute. On a sparse-correction workload with a ~60-operation DAG and up to 10 million records, it cut runtime by 85%, from about 10 minutes to 1.5 minutes.
          - Redesigned partitioning and tuned parallelism to mitigate shuffle bottlenecks, reducing cluster compute costs by ~40% without performance degradation.
          - Optimized table partitioning using Spark execution plans and Databricks query profiles, increasing data skipping from 65% to 98% and reducing dashboard refresh latency from ~5 minutes to ~10 seconds.
      - company: JPMorgan Chase & Co.
        position: Software Engineer I
        start_date: 2023-01
        end_date: 2024-12
        highlights:
          - Profiled memory growth of a Polars-based transformation in AWS Lambda; introduced lazy evaluation and explicit object lifecycle control, reducing peak memory allocation by 60% and stabilizing execution latency.
          - Brought up a multi-node ingestion system on Kubernetes (EKS + NiFi), implemented Airflow orchestration for distributed workflows, and operated cross-service data movement pipelines in production.
          - Implemented a schema-driven validation tool generating record-level checks from external specifications, eliminating iterative reprocessing and reducing failure diagnosis time by 95%.
          - Earned accelerated promotion to Software Engineer II for ownership of distributed data infrastructure and production performance engineering.
    Education:
      - institution: Georgia Institute of Technology
        area: Computer Science - Computing Systems
        degree: MS
        date: Expected May 2028
        highlights:
          - MS Research Fellow
      - institution: The National Institute of Engineering
        area: Computer Science and Engineering
        degree: BE
        start_date: 2019-08
        end_date: 2023-06
        highlights:
          - Operating Systems, Analysis and Design of Algorithms, Data Structures, Database Systems, Cloud Computing, Discrete Mathematics, Computer Architecture
          - Merit Scholarship (full tuition waiver for all semesters), awarded for top entrance rank.
    Projects:
      - name: "[XDBC: Cross-DBMS Data Transfer](https://github.com/TheMonocledHamster/xdbc-replication)"
        start_date: 2026-09
        end_date: 2026-11
        highlights:
          - Built an end-to-end bulk data transfer system in Go, including client and server pipelines, wire-protocol messaging, and buffer management.
          - Reproduced benchmarks from the [original XDBC paper](https://doi.org/10.1145/3725294) to compare transfer performance against PostgreSQL foreign data wrapper baselines.
      - name: "[POWER RTL-to-C Transpiler](https://arxiv.org/abs/2306.08701)"
        date: 2023-06
        highlights:
          - Built a transpiler translating ISA pseudocode into executable simulation models for gem5-based microarchitectural performance experiments.
    Skills:
      - label: Languages
        details: Python, Java, Go, C++, SQL, Rust
      - label: Data Systems
        details: Apache Spark, Databricks, PostgreSQL, Airflow, PyTorch, Neo4j
      - label: Infrastructure
        details: Kubernetes, AWS, Linux, Docker, CI/CD
    Teaching Experience:
      - company: Georgia Institute of Technology
        position: Graduate Teaching Assistant
        start_date: 2026-08
        end_date: present
        highlights:
          - CS 6200, Graduate Introduction to Operating Systems (OMSCS, Fall 2026).
      - company: Vidhyavardhaka College of Engineering, Mysuru
        position: DevOps Workshop Instructor
        date: 2023-09
        highlights:
          - Designed and delivered a five-day hands-on workshop for faculty covering containerization, CI/CD, and deployment workflows for distributed systems.
